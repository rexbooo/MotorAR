<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yamaha R3 WebAR 導購系統</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; }
        
        /* 網頁 UI 提示與按鈕 */
        #ar-button {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            padding: 18px 32px;
            background-color: #00e676;
            color: #121212;
            border: none;
            border-radius: 30px;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 6px 20px rgba(0,230,118,0.4);
            display: none; 
            z-index: 999;
        }

        #instruction {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 16px;
            z-index: 999;
            text-align: center;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="instruction">請將相機對準機車目錄照片</div>
    <button id="ar-button">🏍️ 在網頁直接投放到空地</button>

    <a-scene id="ar-scene" 
             mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; missTolerance: 10;" 
             embedded color-space="sRGB" 
             renderer="colorManagement: true, physicallyCorrectLights" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <a-asset-item id="r3Model" src="./yamaha_yzf-r3_2017.glb"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity id="image-target" mindar-image-target="targetIndex: 0">
            <a-gltf-model src="#r3Model" position="0 0 0" scale="0.05 0.05 0.05" rotation="90 0 0"></a-gltf-model>
        </a-entity>

        <a-entity id="space-anchor" position="0 -1 -2" visible="false">
            <a-gltf-model src="#r3Model" scale="1 1 1" rotation="0 180 0"></a-gltf-model>
        </a-entity>
        
    </a-scene>

    <script>
        const imageTarget = document.querySelector('#image-target');
        const arButton = document.querySelector('#ar-button');
        const instruction = document.querySelector('#instruction');
        const spaceAnchor = document.querySelector('#space-anchor');
        const arScene = document.querySelector('#ar-scene');

        // 1. 當掃描到目錄照片時
        imageTarget.addEventListener("targetFound", () => {
            arButton.style.display = "block";
            instruction.innerText = "成功識別！請點擊下方按鈕進行空間投放";
        });

        // 2. 點擊按鈕：不跳出網頁，直接在原本網頁內切換模式
        arButton.addEventListener("click", () => {
            arButton.style.display = "none"; // 隱藏按鈕
            instruction.innerText = "請將手機對準空曠地面，車子將直接在網頁中生成";

            // 【核心技術切換】：停止影像追蹤系統，並將 1:1 模型在網頁的虛擬三維空間中解鎖顯示
            // 這會把車子直接「定錨」在相機前方（相對於手機的坐標系）
            spaceAnchor.setAttribute('visible', 'true');
            
            // 讓網頁內的相機開啟陀螺儀連動，這樣你走動時，車子才會留在原地，產生 AR 的感覺
            const camera = document.querySelector('a-camera');
            camera.setAttribute('look-controls', 'enabled: true');
        });
    </script>
</body>
</html>
